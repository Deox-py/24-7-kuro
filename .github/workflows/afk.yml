name: Minecraft NPC Bot 24/7

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite ejecutar manualmente desde la interfaz de GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install mineflayer minecraft-protocol-forge mineflayer-pathfinder

      - name: Ejecutar script del NPC
        run: node bot.js
