name: Minecraft NPC Bot Keep-Alive

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Se ejecuta automáticamente cada 5 horas para reiniciar el ciclo
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install mineflayer minecraft-protocol-forge mineflayer-pathfinder

      - name: Ejecutar script del NPC (Límite de 5 Horas)
        run: timeout 5h node bot.js || true
