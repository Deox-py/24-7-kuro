name: Minecraft NPC Bot Keep-Alive

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Se ejecuta automáticamente cada 5 horas
    - cron: '0 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install mineflayer minecraft-protocol-forge mineflayer-pathfinder

      - name: Ejecutar script del NPC (Límite 5 Horas)
        # timeout corta la ejecución limpiamente a las 5 horas antes de la cancelación de GitHub
        run: timeout 5h node bot.js || true
